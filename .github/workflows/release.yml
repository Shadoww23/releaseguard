name: Release packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install the declared build backend
        run: python -m pip install "setuptools>=61"
      - name: Run the test suite
        run: python -m unittest discover -s tests -v
      - name: Build and verify release packages
        run: python scripts/package.py --output-dir artifacts
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${GITHUB_REF_NAME}" artifacts/*
          --title "ReleaseGuard ${GITHUB_REF_NAME}"
          --notes-file RELEASE-NOTES.md
