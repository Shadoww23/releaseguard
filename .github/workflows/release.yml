name: Release packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install the declared build backend
        run: python -m pip install "setuptools>=61"
      - name: Run the test suite
        run: python -m unittest discover -s tests -v
      - name: Build and verify release packages
        run: python scripts/package.py --output-dir artifacts
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          TITLE="ReleaseGuard ${TAG}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/* --clobber
            gh release edit "$TAG" --title "$TITLE" --notes-file RELEASE-NOTES.md
          else
            gh release create "$TAG" artifacts/* --title "$TITLE" --notes-file RELEASE-NOTES.md
          fi
