[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "releaseguard-local"
version = "0.1.0"
description = "Local game release-readiness checks and save protection"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
releaseguard = "releaseguard:main"

[tool.setuptools]
py-modules = ["releaseguard"]
